name: Reproduce iOS build failure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-ios:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: ReproducerApp/yarn.lock

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          working-directory: ReproducerApp

      - name: Install JavaScript packages
        working-directory: ReproducerApp
        run: yarn install --frozen-lockfile

      - name: Install CocoaPods packages
        working-directory: ReproducerApp/ios
        run: bundle exec pod install

      - name: Reproduce the failure
        run: bash repro-rncore-swap.sh
